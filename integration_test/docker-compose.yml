# Docker Compose for WhatsSignal Integration Testing
# Optional external dependencies for comprehensive integration testing

services:
  # Signal-CLI service for real Signal integration testing.
  # Pinned >= 0.100 (signal-cli v0.14.5): earlier builds throw the getServerGuid
  # NPE on every inbound message and silently drop all receives
  # (AsamK/signal-cli#2059), which would make a real-Signal test mysteriously
  # see zero inbound traffic.
  signal-cli:
    image: bbernhard/signal-cli-rest-api:0.101@sha256:2cf09d66a86fdd210e42ee91662216364acc27da1163a8c44167a77ea3a6559a
    ports:
      - "${SIGNAL_CLI_HOST_PORT:-8080}:8080"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /run:exec,size=64M,uid=1000,gid=1000,mode=0755
      - /tmp:exec,size=512M,mode=1777
    environment:
      - MODE=json-rpc
      - SIGNAL_CLI_CONFIG_DIR=/home/.local/share/signal-cli
    volumes:
      - signal_data:/home/.local/share/signal-cli
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/about"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - whatsignal-test

  # WAHA (WhatsApp HTTP API) for real WhatsApp integration testing
  waha:
    image: devlikeapro/waha:latest-2026.9.1@sha256:41283bd89922ec3f722e5a772b844c451634d4aa72e9c34043c3480184f970fe
    ports:
      - "3000:3000"
    environment:
      - WAHA_API_KEY=whatsignal-test-key
      - WHATSAPP_HOOK_URL=http://nginx:80/webhook/whatsapp
      - WHATSAPP_HOOK_EVENTS=message,message.any,session.status
      - WHATSAPP_START_SESSION=default
    volumes:
      - waha_data:/app/.sessions
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "X-Api-Key: whatsignal-test-key", "http://localhost:3000/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - whatsignal-test

  # PostgreSQL for database integration testing (alternative to SQLite)
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=whatsignal_test
      - POSTGRES_USER=whatsignal
      - POSTGRES_PASSWORD=test_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./test-data/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsignal -d whatsignal_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsignal-test

  # Redis for caching and session management testing
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    ports:
      - "6379:6379"
    command: redis-server --requirepass test_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "test_password", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - whatsignal-test

  # Prometheus for metrics testing
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    ports:
      - "9090:9090"
    volumes:
      - ./test-data/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=1h'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - whatsignal-test

  # Jaeger for tracing testing
  jaeger:
    image: jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
    ports:
      - "16686:16686"
      - "14250:14250"
    networks:
      - whatsignal-test

  # MinIO for S3-compatible storage testing
  minio:
    profiles: ["s3"]
    build:
      context: .
      dockerfile: Dockerfile.minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=whatsignal
      - MINIO_ROOT_PASSWORD=test_password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - whatsignal-test

  # Nginx for reverse proxy and load balancing testing
  nginx:
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    ports:
      - "${NGINX_HOST_PORT:-8081}:80"
    volumes:
      - ./test-data/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - waha
      - signal-cli
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - whatsignal-test

volumes:
  signal_data:
    driver: local
  waha_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  minio_data:
    driver: local

networks:
  whatsignal-test:
    driver: bridge
