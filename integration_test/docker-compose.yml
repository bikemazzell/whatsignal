# Docker Compose for WhatsSignal Integration Testing
# Optional external dependencies for comprehensive integration testing

services:
  # Signal-CLI service for real Signal integration testing.
  # Pinned >= 0.100 (signal-cli v0.14.5): earlier builds throw the getServerGuid
  # NPE on every inbound message and silently drop all receives
  # (AsamK/signal-cli#2059), which would make a real-Signal test mysteriously
  # see zero inbound traffic.
  signal-cli:
    image: bbernhard/signal-cli-rest-api:0.101@sha256:2cf09d66a86fdd210e42ee91662216364acc27da1163a8c44167a77ea3a6559a
    ports:
      - "${SIGNAL_CLI_HOST_PORT:-8080}:8080"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /run:exec,size=64M,uid=1000,gid=1000,mode=0755
      - /tmp:exec,size=512M,mode=1777
    environment:
      - MODE=json-rpc
      - SIGNAL_CLI_CONFIG_DIR=/home/.local/share/signal-cli
    volumes:
      - signal_data:/home/.local/share/signal-cli
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/about"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - whatsignal-test

  # WAHA (WhatsApp HTTP API) for real WhatsApp integration testing
  waha:
    image: devlikeapro/waha:latest-2026.10.1@sha256:2fc1787ddbd343ed2e7d59482846d1b22aa5ca134e29aa8d42d0e88c54e24779
    ports:
      - "3000:3000"
    environment:
      - WAHA_API_KEY=whatsignal-test-key
      - WHATSAPP_HOOK_URL=http://nginx:80/webhook/whatsapp
      - WHATSAPP_HOOK_EVENTS=message,message.any,session.status
      - WHATSAPP_START_SESSION=default
    volumes:
      - waha_data:/app/.sessions
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "X-Api-Key: whatsignal-test-key", "http://localhost:3000/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - whatsignal-test

  # PostgreSQL for database integration testing (alternative to SQLite)
  postgres:
    image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=whatsignal_test
      - POSTGRES_USER=whatsignal
      - POSTGRES_PASSWORD=test_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./test-data/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsignal -d whatsignal_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsignal-test

  # Redis for caching and session management testing
  redis:
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    ports:
      - "6379:6379"
    command: redis-server --requirepass test_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "test_password", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - whatsignal-test

  # Prometheus for metrics testing
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    ports:
      - "9090:9090"
    volumes:
      - ./test-data/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=1h'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - whatsignal-test

  # Jaeger for tracing testing
  jaeger:
    image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    ports:
      - "16686:16686"
      - "14250:14250"
    networks:
      - whatsignal-test

  # MinIO for S3-compatible storage testing
  minio:
    profiles: ["s3"]
    build:
      context: .
      dockerfile: Dockerfile.minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=whatsignal
      - MINIO_ROOT_PASSWORD=test_password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - whatsignal-test

  # Nginx for reverse proxy and load balancing testing
  nginx:
    image: nginx:alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    ports:
      - "${NGINX_HOST_PORT:-8081}:80"
    volumes:
      - ./test-data/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - waha
      - signal-cli
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - whatsignal-test

volumes:
  signal_data:
    driver: local
  waha_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  minio_data:
    driver: local

networks:
  whatsignal-test:
    driver: bridge
